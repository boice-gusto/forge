id: fullsend.product-lifecycle
version: 2.0.0
sideEffects:
  - github.pr.open
  - feature-flag.set
nodes:
  - id: kickoff
    kind: input
  - id: intake
    kind: approval
  - id: discovery
    kind: agent
    role: architect
  - id: skeptic
    kind: agent
    role: architect
    required: true
  - id: build
    kind: agent
    role: builder
  - id: review-panel
    kind: judge
  - id: human-gate
    kind: approval
    gates: [ship]
  - id: ship
    kind: effect
    effect: feature-flag.set
edges:
  - from: kickoff
    to: intake
  - from: intake
    to: discovery
  - from: discovery
    to: skeptic
  - from: skeptic
    to: build
  - from: build
    to: review-panel
  - from: review-panel
    to: human-gate
  - from: human-gate
    to: ship
  - from: discovery
    to: build
