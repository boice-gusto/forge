name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The durable-store suites skip when no container runtime is reachable,
      # and a skip is invisible in a CI summary. This turns skipping into a
      # failure and applies those packages' coverage floors. Local development
      # deliberately does not set it — nothing but these two adapters needs
      # Docker, and gating the whole repo on it would push people to skip
      # verification altogether.
      #
      # Probing `docker info` instead would not work: Testcontainers reads
      # DOCKER_HOST and ignores Docker contexts, so the CLI can succeed on a
      # Colima or rootless host while every container test silently skips.
      FORGE_REQUIRE_STORES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      # Packs the public surface and uses it from a throwaway project with no
      # access to this repository. A company package in a sibling repo depends
      # on exactly this, and nothing else proves it works.
      # Browsers are downloaded on demand and cached, never committed.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @forge/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @forge/ui test:e2e
      - run: pnpm --filter @forge/ui typecheck:e2e
      - run: pnpm test:packaging
      - run: pnpm test:architecture
      - run: pnpm test:security
      - run: pnpm security:secrets
      - run: pnpm security:licenses
      - run: pnpm measure:phase1

  # Real processes, real containers, deliberate failure. Separate from `verify`
  # because it costs minutes and needs Docker — and separate so that when it
  # goes red it is obvious what kind of thing broke.
  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:resilience
