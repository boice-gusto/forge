name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Postgres store suites skip when Docker is absent. A skip is
      # invisible in the CI summary, so an absent daemon must fail loudly
      # rather than let those adapters go unverified.
      - name: Require Docker for the Testcontainers suites
        run: docker info > /dev/null || (echo "Docker unavailable; the Postgres store suites would silently skip" && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:architecture
      - run: pnpm test:security
      - run: pnpm security:secrets
      - run: pnpm security:licenses
      - run: pnpm measure:phase1
